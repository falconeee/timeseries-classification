[project]
name = "timeseries-classification"
version = "0.1.0"
description = "Classificação de séries temporais multivariadas para detecção de falhas em dados de sensores."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "sktime>=1.2.0",
    "torch>=2.9.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsc"]
