[project]
name = "timeseries-classification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.114",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "sktime>=1.2.0",
    "tensorflow>=2.21.0",
    "tsfresh>=0.21.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
